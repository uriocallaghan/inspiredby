<!doctype html><html lang="ca"><meta charset="utf-8"><title>El mapa que va aturar el còlera</title>
<!-- Portada i miniatura: el mapa de Snow redibuixat amb les seves dades (HistData): carrers en gris, morts en vermell,
     bombes en blau i la de Broad Street en vermell, sobre el «territori» de la bomba en groc. Sense text.
     cover.jpg: ?w=1680&h=720 · thumb.webp: ?w=800&h=1000 -->
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="dades.js"></script>
<script>
const q=new URLSearchParams(location.search), W=+q.get("w")||1680, H=+q.get("h")||720;
const c=document.getElementById("c"); c.width=W; c.height=H; const x=c.getContext("2d");
x.fillStyle="#fff"; x.fillRect(0,0,W,H);
const D=window.CH_DATA, bs=D.pumps[6];
const k=Math.max(W,H)/(W>H?9.5:12.5), P=(a,b)=>[W/2+(a-bs[0]-.6)*k, H/2-(b-bs[1]-.3)*k];
x.lineCap="round";
x.strokeStyle="rgba(245,197,24,.55)"; x.lineWidth=k*.16;
D.segs.filter(s=>s[4]===6).forEach(s=>{ const a=P(s[0],s[1]), b=P(s[2],s[3]); x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke(); });
x.strokeStyle="rgba(18,18,18,.38)"; x.lineWidth=Math.max(1,k*.025);
D.segs.forEach(s=>{ const a=P(s[0],s[1]), b=P(s[2],s[3]); x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke(); });
x.fillStyle="rgba(200,68,42,.62)";
D.deaths.forEach(d=>{ const p=P(d[0],d[1]); x.beginPath(); x.arc(p[0],p[1],k*.05,0,6.2832); x.fill(); });
D.pumps.forEach((p,i)=>{ const q=P(p[0],p[1]); x.fillStyle=i===6?"#C8442A":"#2C5DA8"; x.beginPath(); x.arc(q[0],q[1],k*(i===6?.13:.09),0,6.2832); x.fill(); x.strokeStyle="#fff"; x.lineWidth=k*.03; x.stroke(); });
</script>
</html>
