<!doctype html><html lang="ca"><meta charset="utf-8"><title>La malaltia que vam esborrar</title>
<!-- Portada i miniatura: els 31 països amb verola endèmica el gener del 1967 (vermell) sobre la terra (gris).
     Sense text.
     cover.jpg: ?w=1680&h=720 · thumb.webp: ?w=800&h=1000 -->
<style>html,body{margin:0;background:#fff}svg{display:block}</style>
<svg id="s"></svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="dades.js"></script>
<script>
const q=new URLSearchParams(location.search), W=+q.get("w")||1680, H=+q.get("h")||720, tall=H>W;
const s=d3.select("#s").attr("width",W).attr("height",H).attr("viewBox",`0 0 ${W} ${H}`);
s.append("rect").attr("width",W).attr("height",H).attr("fill","#fff");
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r=>r.json()).then(tp=>{
  const land=topojson.feature(tp,tp.objects.land), cs=topojson.feature(tp,tp.objects.countries).features;
  const E=new Set(window.VE_DATA.endemic["1967"]);
  const p=tall?d3.geoEqualEarth().rotate([-60,0]).scale(W*0.62).translate([W*0.42,H*0.5])
              :d3.geoEqualEarth().rotate([-30,0]).scale(W*0.27).translate([W*0.5,H*0.56]);
  const path=d3.geoPath(p);
  s.append("path").datum(land).attr("d",path).attr("fill","#ECEBE8");
  s.append("g").selectAll("path").data(cs.filter(f=>E.has(String(f.id).padStart(3,"0")))).join("path").attr("d",path).attr("fill","#C8442A").attr("fill-opacity",.82);
  s.append("path").datum(topojson.mesh(tp,tp.objects.countries,(a,b)=>a!==b)).attr("d",path).attr("fill","none").attr("stroke","#fff").attr("stroke-width",.8);
});
</script>
</html>
