<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Cover · Qui era realment Jesús?</title>
<style>
  html,body{margin:0;padding:0;width:1680px;height:720px;overflow:hidden;background:#FFFFFF}
  svg{display:block;width:1680px;height:720px}
</style>
</head>
<body>
<svg viewBox="0 0 1680 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Il·lustració abstracta d'esferes translúcides i línies del temps">
  <defs>
    <radialGradient id="gRed" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#C8442A" stop-opacity="0.52"/>
      <stop offset="72%" stop-color="#C8442A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C8442A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBlue" cx="45%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2C5DA8" stop-opacity="0.46"/>
      <stop offset="74%" stop-color="#2C5DA8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2C5DA8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gYel" cx="46%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#F5C518" stop-opacity="0.56"/>
      <stop offset="74%" stop-color="#F5C518" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F5C518" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1680" height="720" fill="#FFFFFF"/>

  <!-- Eixos discontinus ultra-fins: el mirall del temps -->
  <line x1="120" y1="360" x2="1560" y2="360" stroke="#DADADA" stroke-width="1.2" stroke-dasharray="4 6"/>
  <line x1="840" y1="68" x2="840" y2="652" stroke="#DADADA" stroke-width="1.2" stroke-dasharray="4 6"/>

  <!-- Arcs de flux des del nucli històric (esquerra) cap a les capes posteriors (dreta) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 420 360 Q 680 120 1030 245" stroke="#2C5DA8" stroke-width="1.4" stroke-opacity="0.34"/>
    <path d="M 420 360 Q 740 165 1170 310" stroke="#2C5DA8" stroke-width="1.1" stroke-opacity="0.26"/>
    <path d="M 420 360 Q 780 560 1265 445" stroke="#C8442A" stroke-width="1.3" stroke-opacity="0.30"/>
    <path d="M 420 360 Q 650 490 955 470" stroke="#F5C518" stroke-width="2.2" stroke-opacity="0.45"/>
    <path d="M 420 360 Q 880 80 1355 250" stroke="#C8442A" stroke-width="1.0" stroke-opacity="0.22" stroke-dasharray="3 5"/>
  </g>

  <!-- Cercles translúcids d'aquarel·la (multiply): el nucli del segle I i els miralls dels segles posteriors -->
  <g style="mix-blend-mode:multiply">
    <circle cx="420" cy="360" r="225" fill="url(#gRed)"/>
    <circle cx="705" cy="295" r="150" fill="url(#gBlue)"/>
    <circle cx="1030" cy="245" r="195" fill="url(#gBlue)"/>
    <circle cx="955" cy="470" r="165" fill="url(#gYel)"/>
    <circle cx="1265" cy="445" r="215" fill="url(#gRed)"/>
    <circle cx="1355" cy="250" r="145" fill="url(#gYel)"/>
  </g>

  <!-- Punts de referència precisos sobre la trama -->
  <g>
    <circle cx="420" cy="360" r="9" fill="#C8442A" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="705" cy="295" r="5.5" fill="#2C5DA8" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="1030" cy="245" r="6.5" fill="#2C5DA8" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="955" cy="470" r="6" fill="#121212" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="1265" cy="445" r="7.5" fill="#C8442A" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="1355" cy="250" r="5" fill="#121212" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Petita constel·lació de micro-punts al voltant del nucli històric (Galilea) -->
  <g fill="#C8442A" fill-opacity="0.34">
    <circle cx="348" cy="308" r="3.2"/><circle cx="385" cy="272" r="2.6"/><circle cx="468" cy="294" r="3.5"/>
    <circle cx="496" cy="342" r="2.4"/><circle cx="472" cy="422" r="3.1"/><circle cx="390" cy="448" r="2.8"/>
    <circle cx="332" cy="396" r="3.4"/><circle cx="316" cy="346" r="2.2"/><circle cx="445" cy="395" r="2.7"/>
    <circle cx="372" cy="368" r="2.3"/><circle cx="412" cy="316" r="2.5"/><circle cx="456" cy="336" r="2.1"/>
  </g>
</svg>
</body>
</html>
