<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Portada · La gran migració de cada nit</title>
<style>html,body{margin:0;background:#0A1422}svg{display:block}</style>
</head>
<body>
<svg id="c" xmlns="http://www.w3.org/2000/svg" width="1680" height="720" viewBox="0 0 1680 720">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA7D0"/>
      <stop offset=".18" stop-color="#356592"/>
      <stop offset=".45" stop-color="#1C3A60"/>
      <stop offset=".75" stop-color="#11223A"/>
      <stop offset="1" stop-color="#0A1422"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A1422" stop-opacity="0"/>
      <stop offset=".3" stop-color="#0A1422" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#0A1422" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0A1422" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE7F2"/>
      <stop offset=".22" stop-color="#EFC9AE"/>
      <stop offset=".34" stop-color="#2A3550"/>
      <stop offset=".66" stop-color="#2A3550"/>
      <stop offset=".78" stop-color="#EFC9AE"/>
      <stop offset="1" stop-color="#DCE7F2"/>
    </linearGradient>
  </defs>
  <rect width="1680" height="72" fill="url(#sky)"/>
  <rect y="72" width="1680" height="648" fill="url(#sea)"/>
  <rect y="72" width="1680" height="648" fill="url(#night)"/>
  <circle cx="230" cy="40" r="14" fill="#C8442A"/>
  <circle cx="1450" cy="40" r="14" fill="#C8442A"/>
  <g id="ph"></g>
  <g id="an"></g>
</svg>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg",seed=9;
  function r(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
  function g(){var u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
  var ph=document.getElementById("ph"),an=document.getElementById("an");
  for(var i=0;i<520;i++){var c=document.createElementNS(NS,"circle");c.setAttribute("cx",r()*1680);c.setAttribute("cy",80+Math.pow(r(),.8)*95);c.setAttribute("r",1.6);c.setAttribute("fill","#7DBE5A");c.setAttribute("opacity",.75);ph.appendChild(c)}
  // layer depth along x: deep by day (edges), near the surface at night (middle)
  function depth(x){var u=x/1680,a=Math.min(1,Math.max(0,(u-.2)/.16)),b=Math.min(1,Math.max(0,(.8-u)/.16));var s=Math.min(a*a*(3-2*a),b*b*(3-2*b));return 470-(470-110)*s}
  for(var k=0;k<2600;k++){
    var x=r()*1680,mig=r()<.62,y=mig?depth(x)+g()*38:560+g()*55;
    if(y<84)y=84+r()*20;
    var e=document.createElementNS(NS,"ellipse"),s=.7+r()*1.1;
    e.setAttribute("cx",x.toFixed(1));e.setAttribute("cy",y.toFixed(1));e.setAttribute("rx",(mig?2.6:2)*s);e.setAttribute("ry",(mig?1.1:.9)*s);
    e.setAttribute("fill",mig?(r()<.8?"#F0A852":"#D9822B"):"#8D99A6");e.setAttribute("opacity",mig?(.55+r()*.4):(.35+r()*.3));an.appendChild(e)}
})();
</script>
</body>
</html>
