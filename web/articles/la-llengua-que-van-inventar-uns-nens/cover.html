<!doctype html><html lang="ca"><meta charset="utf-8"><title>La llengua que va néixer en un pati de Managua</title>
<!-- Portada i miniatura: els més de 400 alumnes sords de Managua el 1983 (un punt per alumne, en espiral d'arribada)
     i fils de converses entre ells. Sense text. cover.jpg: ?w=1680&h=720 · thumb.webp: ?w=800&h=1000 -->
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const q=new URLSearchParams(location.search), W=+q.get("w")||1680, H=+q.get("h")||720;
const c=document.getElementById("c"); c.width=W; c.height=H; const x=c.getContext("2d");
x.fillStyle="#fff"; x.fillRect(0,0,W,H);
let a=7; const r=()=>{ a=(a*16807)%2147483647; return a/2147483647; };
const R=Math.min(W,H)*.46, cx=W/2, cy=H/2, N=400, P=[];
x.globalCompositeOperation="multiply";
x.fillStyle="rgba(245,197,24,.16)"; x.beginPath(); x.ellipse(cx,cy,R*1.05,R*.92,0,0,6.2832); x.fill();
for(let i=0;i<N;i++){ const t=i*2.39996, rr=Math.sqrt((i+.5)/N)*R; P.push([cx+rr*Math.cos(t),cy+rr*Math.sin(t)*.88]); }
x.strokeStyle="rgba(44,93,168,.42)"; x.lineWidth=Math.max(1,W/1300);
for(let k=0;k<260;k++){ const p=P[Math.floor(r()*N)], s=P[Math.floor(r()*N)]; if(Math.hypot(p[0]-s[0],p[1]-s[1])>R*.6)continue;
  x.beginPath(); x.moveTo(p[0],p[1]); x.quadraticCurveTo((p[0]+s[0])/2,(p[1]+s[1])/2-R*.08,s[0],s[1]); x.stroke(); }
const dr=Math.max(3,Math.min(W,H)/150);
P.forEach((p,i)=>{ x.fillStyle=i<25?"rgba(122,35,18,.9)":"rgba(200,68,42,.78)"; x.beginPath(); x.arc(p[0],p[1],dr,0,6.2832); x.fill(); });
</script>
</html>
