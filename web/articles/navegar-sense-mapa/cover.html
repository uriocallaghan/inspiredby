<!doctype html><html lang="ca"><meta charset="utf-8"><title>Navegar sense mapa</title>
<!-- Portada i miniatura: la brúixola estel·lar calculada per a la latitud de Tahití (17,5° S) amb les declinacions reals
     de dades.js, les 32 cases i la ruta de Hōkūleʻa 1976 en vermell. Sense text.
     cover.jpg: ?w=1680&h=720 · thumb.webp: ?w=800&h=1000 -->
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="dades.js"></script>
<script>
const q=new URLSearchParams(location.search), W=+q.get("w")||1680, H=+q.get("h")||720;
const c=document.getElementById("c"); c.width=W; c.height=H; const x=c.getContext("2d");
x.fillStyle="#fff"; x.fillRect(0,0,W,H);
const port=H>W, R=port?W*.42:H*.42, cx=port?W/2:W*.66, cy=port?H*.36:H/2, lat=-17.5;
const P=(az,r)=>[cx+r*Math.sin(az*Math.PI/180), cy-r*Math.cos(az*Math.PI/180)];
// fons: la ruta de 1976 (traça digitalitzada), en gran, a la banda esquerra o inferior
const route=NAV.route, lons=route.map(p=>p[0]), lats=route.map(p=>p[1]);
const latR=Math.max(...lats)-Math.min(...lats), lonR=Math.max(...lons)-Math.min(...lons);
const k=(H*.86)/latR, kx=k*Math.cos(2*Math.PI/180), ox=port?W*.5-lonR*kx*.5:W*.34-lonR*kx*.5;
const sx=v=>ox+(v-Math.min(...lons))*kx, sy=v=>H*.07+(Math.max(...lats)-v)*k;
x.beginPath(); route.forEach((p,i)=>{ const X=sx(p[0]), Y=sy(p[1]); i?x.lineTo(X,Y):x.moveTo(X,Y); }); x.strokeStyle="#C8442A"; x.lineWidth=Math.max(W,H)/300; x.lineCap="round"; x.lineJoin="round"; x.stroke();
// anell i 32 cases
x.beginPath(); x.arc(cx,cy,R,0,6.2832); x.fillStyle="rgba(44,93,168,.05)"; x.fill(); x.strokeStyle="#121212"; x.lineWidth=1.4; x.stroke();
for(let i=0;i<32;i++){ const a=P(i*11.25-5.625,R), b=P(i*11.25-5.625,R+R*(i%8===0?.09:.05)); x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.lineWidth=1.2; x.stroke(); }
// estrelles: cordes de sortida a posta
NAV.stars.forEach(d=>{ const cA=Math.sin(d.dec*Math.PI/180)/Math.cos(lat*Math.PI/180); if(Math.abs(cA)>1)return; const A=Math.acos(cA)*180/Math.PI;
  const a=P(A,R*.97), b=P(360-A,R*.97), hi=d.n==="Arcturus"?"#C8442A":d.n==="Sírius"?"#2C5DA8":null;
  x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.strokeStyle=hi||"rgba(18,18,18,.16)"; x.lineWidth=hi?3:1.2; x.stroke();
  const r=Math.max(R*.012,Math.min(R*.035,(4.6-d.mag*1.2)*R/220));
  [a,b].forEach(p=>{ x.beginPath(); x.arc(p[0],p[1],r*(hi?1.3:1),0,6.2832); x.fillStyle=hi||"#F5C518"; x.fill(); }); });
</script>
</html>
