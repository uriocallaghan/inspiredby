[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

# Domini oficial: inspiredbymagazine.com. L'antic subdomini hi redirigeix.
[[redirects]]
  from = "https://inspiredby.uriocallaghan.com/*"
  to = "https://inspiredbymagazine.com/:splat"
  status = 301
  force = true

# CMS de l'editor (web/admin/ + /api/cms/*). La funció viu fora de web/ perquè no es publiqui com a fitxer.
[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"

# Drecera: afegir /admin a l'URL d'un article obre l'editor directament en aquell article
# (decisió de l'editor, 25-11-2026). A la portada, /admin/ ja hi porta.
[[redirects]]
  from = "/articles/:slug/admin"
  to = "/admin/#articles/:slug/"
  status = 302
  force = true

[[redirects]]
  from = "/articles/:slug/admin/"
  to = "/admin/#articles/:slug/"
  status = 302
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; connect-src 'self'; img-src 'self' data: https:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
