# Després de cada push a main (sobretot dels del CMS de l'editor, que no pot executar scripts),
# regenera la portada, «per penjar», el temps de lectura, els peus i sw.js amb scripts/sync-home.mjs.
# Si no canvia res, no fa cap commit. Els commits fets amb GITHUB_TOKEN no tornen a disparar aquest workflow.
name: Sincronia de la web

on:
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: write

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenera la web
        run: node scripts/sync-home.mjs
      - name: Commit si cal
        run: |
          if git diff --quiet; then echo "Tot sincronitzat."; exit 0; fi
          git config user.name "inspiredby-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sincronia automàtica: portada, temps de lectura i sw.js" -m "Via: GitHub Actions (després d'un canvi del CMS o d'un push)"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main && node scripts/sync-home.mjs && git commit -am "Sincronia automàtica: portada, temps de lectura i sw.js" || true
          done
          exit 1
