# Després de cada push a main (sobretot dels del CMS de l'editor, que no pot executar scripts),
# regenera la portada, «per penjar», el temps de lectura, els peus i sw.js amb scripts/sync-home.mjs.
# Si no canvia res, no fa cap commit. Els commits fets amb GITHUB_TOKEN no tornen a disparar aquest workflow.
name: Sincronia de la web

on:
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: write

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenera la web i fes commit si cal
        run: |
          git config user.name "inspiredby-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # cada intent parteix de l'últim main net: mai un rebase a mitges ni un merge de fitxers generats
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/sync-home.mjs
            if git diff --quiet; then echo "Tot sincronitzat."; exit 0; fi
            git commit -qam "Sincronia automàtica: portada, temps de lectura i sw.js" -m "Via: GitHub Actions (després d'un canvi del CMS o d'un push)"
            if git push -q origin HEAD:main; then echo "Fet."; exit 0; fi
            echo "main s'ha mogut; es torna a provar ($i)"; sleep $((i * 3))
          done
          exit 1
